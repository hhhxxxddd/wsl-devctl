name = "dev-python-web"
run_user = "root"
source = "/mnt/c/Users/dev/source/dev-python-web"

[sync]
enabled = true
interval_ms = 750
exclude = [
  "/.git/",
  "/.codegraph/",
  "**/node_modules/",
  "**/.venv/",
  "**/__pycache__/",
  "**/.pytest_cache/",
  "**/dist/"
]

[backend]
enabled = true
workdir = "backend"
port = 8000
prepare = "uv sync --frozen"
run = "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"

[frontend]
enabled = true
workdir = "frontend"
port = 5173
prepare = "pnpm install --frozen-lockfile"
run = "pnpm dev -- --host 0.0.0.0"

[compile]
enabled = false

[branch_switch]
enabled = true
settle_ms = 1500
timeout_seconds = 60
backend_command = "uv sync --frozen"
frontend_command = "pnpm install --frozen-lockfile"

[toolchain]
provider = "mise"
python = true
uv = true
node = true
package_manager = "pnpm"

[checks]
commands = ["uv", "pnpm", "git"]
http = ["http://127.0.0.1:8000/health", "http://127.0.0.1:5173/"]
