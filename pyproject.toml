[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wsl-devctl"
version = "0.2.0"
description = "Run Windows-hosted development workspaces from fast WSL ext4 caches."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "wsl-devctl contributors" }]
dependencies = []

[project.scripts]
wsl-devctl = "wsl_devctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
